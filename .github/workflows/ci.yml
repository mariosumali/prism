name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build all targets and run tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Syntax-check audio plug-in (C++)
        run: |
          for f in PRISMAudioPlugIn/*.cpp; do
            xcrun clang++ -fsyntax-only -std=c++17 -IPRISMShared "$f"
          done
          xcrun clang -fsyntax-only -std=c11 PRISMShared/RingBuffer.c

      - name: Compile-check Metal kernels
        run: |
          for f in PRISMKernels/*.metal; do
            xcrun -sdk macosx metal -c "$f" -IPRISMKernels -o /tmp/$(basename "$f").air
          done

      - name: Build app + camera extension
        run: |
          xcodebuild -project PRISM.xcodeproj -scheme PRISM \
            -configuration Debug -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build | tail -20

      - name: Build audio HAL plug-in
        run: |
          xcodebuild -project PRISM.xcodeproj -scheme PRISMAudioPlugIn \
            -configuration Debug -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build | tail -20

      - name: Run unit tests
        run: |
          xcodebuild -project PRISM.xcodeproj -scheme PRISMTests \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" test | tail -40

      - name: Driver smoke test
        run: |
          if [ -x Tools/driver_smoke/run.sh ]; then Tools/driver_smoke/run.sh; fi

      - name: Verify no networking APIs in source
        # §7 again, from the other end: the otool check below only fires if a
        # framework actually links, which every Foundation-provided path
        # (URLSession lives in Foundation, getaddrinfo in libSystem) walks
        # straight past. Catch the call site instead.
        #
        # Every directory that ends up inside a shipped binary is scanned, not
        # just the three top-level app targets. PRISMShared is compiled into
        # the app, the audio plug-in and the tests (project.yml), it is C on
        # the RT audio path, and a BSD socket there linked nothing but
        # libSystem — so it walked past both tripwires. A check with a hole in
        # it is worse than no check, because it is quoted as evidence.
        run: |
          if grep -rnE 'URLSession|NSURLConnection|NWConnection|NWBrowser|NWListener|NWPathMonitor|NWEndpoint|import Network|CFNetwork|CFStream|NSStream|NSTask|Process\(\)|dnssd|getaddrinfo|sys/socket\.h|socket\(|sendto\(|recvfrom\(|contentsOf: *URL' \
               PRISM PRISMShared PRISMKernels PRISMCameraExtension PRISMAudioPlugIn; then
            echo "::error::Networking API referenced in source"; exit 1
          fi

      - name: Verify no network symbols in app
        # §7: PRISM makes no network connections. Cheap tripwire: the app
        # binary must not link networking frameworks.
        run: |
          BIN=$(find ~/Library/Developer/Xcode/DerivedData -path '*Debug/PRISM.app/Contents/MacOS/PRISM' | head -1)
          if [ -n "$BIN" ]; then
            if otool -L "$BIN" | grep -E 'CFNetwork|Network.framework'; then
              echo "::error::App links networking frameworks"; exit 1
            fi
          fi
